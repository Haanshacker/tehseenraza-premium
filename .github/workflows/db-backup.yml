jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add Hostinger host key
        run: |
          ssh-keyscan -p $SSH_PORT $SSH_HOST >> ~/.ssh/known_hosts
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}

      - name: Backup DB via mysqldump
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_HOST: ${{ secrets.DB_HOST }}
          REMOTE_DB_BACKUP_DIR: /home/u711730434/domains/tehseenraza.net/backups/db
        run: |
          TS=$(date +%Y%m%d-%H%M%S)
          OUT="db-$TS.sql.gz"
          ssh -p $SSH_PORT $SSH_USER@$SSH_HOST "
            mkdir -p $REMOTE_DB_BACKUP_DIR &&
            mysqldump -h $DB_HOST -u $DB_USER -p'$DB_PASSWORD' $DB_NAME | gzip > $REMOTE_DB_BACKUP_DIR/$OUT
          "
          echo "Backup saved: $OUT"
