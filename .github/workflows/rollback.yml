name: Rollback Theme to Previous Backup

on:
  workflow_dispatch:
    inputs:
      file:
        description: 'Backup filename (leave empty -> use latest)'
        required: false
        default: ''

permissions:
  contents: read

env:
  REMOTE_BACKUP_DIR: /home/u711730434/domains/tehseenraza.net/backups/guest-newsletter-theme
  REMOTE_THEME_DIR: /home/u711730434/domains/tehseenraza.net/public_html/wp-content/themes/guest-newsletter-theme

jobs:
  rollback:
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Determine backup file
        id: pick
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          FILE="${{ github.event.inputs.file }}"

          if [ -n "$FILE" ]; then
            echo "chosen=$FILE" >> $GITHUB_OUTPUT
            exit 0
          fi

          LATEST=$(ssh -p $SSH_PORT $SSH_USER@$SSH_HOST "ls -1t $REMOTE_BACKUP_DIR | head -1")
          echo "chosen=$LATEST" >> $GITHUB_OUTPUT

      - name: Restore backup on server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          BACKUP=${{ steps.pick.outputs.chosen }}
          ssh -p $SSH_PORT $SSH_USER@$SSH_HOST "
            rm -rf $REMOTE_THEME_DIR/* &&
            unzip -o $REMOTE_BACKUP_DIR/$BACKUP -d $REMOTE_THEME_DIR
          "
