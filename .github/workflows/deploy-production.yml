name: Deploy WordPress Theme to Production (Hostinger)

on:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  THEME_DIR: tehseenraza-premium
  REMOTE_THEME_DIR: "/home/u711730434/domains/tehseenraza.net/public_html/wp-content/themes/tehseenraza-premium/"
  REMOTE_BACKUP_DIR: "/home/u711730434/domains/tehseenraza.net/backups/theme-backup/"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Ensure backup folder exists
        run: |
          ssh -o StrictHostKeyChecking=no -p "${{ secrets.SSH_PORT }}" \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "mkdir -p '${{ env.REMOTE_BACKUP_DIR }}'"

      - name: Backup existing theme (if exists)
        run: |
          ssh -o StrictHostKeyChecking=no -p "${{ secrets.SSH_PORT }}" \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" << 'SSH'
THEME_DIR="${REMOTE_THEME_DIR}"
BACKUP_DIR="${REMOTE_BACKUP_DIR}"
TS=$(date +"%Y%m%d-%H%M%S")

if [ -d "$THEME_DIR" ]; then
  mkdir -p "$BACKUP_DIR"
  cp -a "$THEME_DIR" "${BACKUP_DIR}backup-$TS"
  echo "Backup created: backup-$TS"
else
  echo "No existing theme found — skipping backup."
fi
SSH

      - name: Upload theme using rsync
        run: |
          rsync -avz --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            -e "ssh -p ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=no" \
            "${{ env.THEME_DIR }}/" \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ env.REMOTE_THEME_DIR }}"

      - name: Fix permissions
        run: |
          ssh -o StrictHostKeyChecking=no -p "${{ secrets.SSH_PORT }}" \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "chmod -R 755 '${{ env.REMOTE_THEME_DIR }}'"

      - name: Complete
        run: echo "Deploy finished successfully 🎉"
