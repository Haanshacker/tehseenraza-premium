name: Deploy WordPress Theme to Production (Hostinger)

on:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  THEME_DIR: tehseenraza-premium
  REMOTE_THEME_DIR: "/home/u711730434/domains/tehseenraza.net/public_html/wp-content/themes/guest-newsletter-theme/"
  REMOTE_BACKUP_DIR: "/home/u711730434/domains/tehseenraza.net/backups/theme-backups/"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      #############################################
      # Setup SSH
      #############################################
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      #############################################
      # Create backup folder on server (safe)
      #############################################
      - name: Create backup folder
        run: |
          ssh -o StrictHostKeyChecking=no \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} -p ${{ secrets.SSH_PORT }} \
            "mkdir -p $REMOTE_BACKUP_DIR"

      #############################################
      # Backup current theme
      #############################################
      - name: Backup current production theme
        run: |
          ssh -o StrictHostKeyChecking=no \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} -p ${{ secrets.SSH_PORT }} \
            "cp -r $REMOTE_THEME_DIR $REMOTE_BACKUP_DIR/theme-backup-$(date +'%Y%m%d%H%M')"

      #############################################
      # Upload new theme
      #############################################
      - name: Upload new theme via rsync
        run: |
          rsync -avz --delete \
            -e "ssh -p ${{ secrets.SSH_PORT }}" \
            $THEME_DIR/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:$REMOTE_THEME_DIR
