name: Deploy WordPress Theme to Production (Hostinger)

on:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  THEME_DIR: guest-newsletter-theme
  REMOTE_THEME_DIR: /home/u711730434/domains/tehseenraza.net/public_html/wp-content/themes/guest-newsletter-theme
  REMOTE_BACKUP_DIR: /home/u711730434/domains/tehseenraza.net/backups/guest-newsletter-theme

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      #########################################
      # Setup SSH (correct version)
      #########################################
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      #########################################
      # Prepare theme folder
      #########################################
      - name: Prepare theme folder
        run: |
          rm -rf $THEME_DIR
          mkdir -p $THEME_DIR
          cp -R ./* $THEME_DIR
          rm -rf $THEME_DIR/.github

      #########################################
      # Inject screenshot
      #########################################
      - name: Add screenshot
        run: |
          SRC="/mnt/data/2C101955-4BB9-4665-9DDD-4718E82796B5.jpeg"
          DEST="./${THEME_DIR}/screenshot.png"
          if [ -f "$SRC" ]; then cp "$SRC" "$DEST"; fi

      #########################################
      # Server Backup (SSH)
      #########################################
      - name: Create backup on server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          TS=$(date +%Y%m%d-%H%M%S)
          ssh -p $SSH_PORT $SSH_USER@$SSH_HOST "
            mkdir -p $REMOTE_BACKUP_DIR &&
            cd $REMOTE_THEME_DIR &&
            zip -r $REMOTE_BACKUP_DIR/theme-$TS.zip .
          "

      #########################################
      # FTP DEPLOY (fixed version)
      #########################################
      - name: Deploy to Hostinger FTP
        uses: SamKirkland/FTP-Deploy-Action@4.3.0
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT || '21' }}
          protocol: ftp
          local-dir: $THEME_DIR
          server-dir: $REMOTE_THEME_DIR
          exclude: |
            **/.github*
            **/.git*
            **/node_modules

      #########################################
      # Upload ZIP artifact
      #########################################
      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: theme-production
          path: $THEME_DIR
