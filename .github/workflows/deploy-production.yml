name: Deploy WordPress Theme via SFTP (Hostinger)

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    name: SFTP Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Upload theme via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          privateKey: ${{ secrets.SSH_PRIVATE_KEY }}

          # Local theme folder from your repo root
          local_path: "tehseenraza-premium/*"

          # Remote WP theme directory from Hostinger
          remote_path: ${{ secrets.REMOTE_THEME_DIR }}

          overwrite: true
          remove_extra_files: false

      - name: Fix permissions
        run: |
          ssh -o StrictHostKeyChecking=no -p "${{ secrets.SSH_PORT }}" \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "chmod -R 755 '${{ secrets.REMOTE_THEME_DIR }}'"

      - name: Complete
        run: echo "🎉 SFTP Deploy finished successfully!"
